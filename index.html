function entityProfile(){const x=e(),v=x.info;const url=/^https?:\/\//i.test(v.url||'')?`<a href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">Abrir plataforma ↗</a>`:'Sin URL registrada';return `<div class="hero"><div><small>FICHA DE LA ENTIDAD</small><h2>${esc(x.name)}</h2><p>NIT ${esc(v.nit||'pendiente')} · ${esc(v.production)}</p></div>${button('Editar información','entityedit')}</div><div class="actions"></div><div class="two"><div class="card"><h2>Información de implementación</h2><div class="grid" style="grid-template-columns:repeat(2,1fr)">${entityFields.filter(([k])=>k!=='url').map(([k,label])=>`<div style="padding:12px 0"><small>${label}</small><h3>${esc(v[k]??'Sin registrar')||'Sin registrar'}</h3></div>`).join('')}</div>${url}</div><div><div class="card"><h2>Seguro y afianzamiento</h2><label>Seguro</label><p>${esc(v.insurance||'Sin definir')}${v.insurance==='Si'?' · '+esc(v.insuranceProvider||'Proveedor pendiente'):''}</p><label>Afianzamiento</label><p>${esc(v.guarantee||'Sin definir')}${v.guarantee==='Si'?' · '+esc(v.guaranteeProvider||'Proveedor pendiente'):''}</p></div><div class="card"><h2>Seguimiento del expediente</h2><p>${x.tasks.filter(t=>t.status!=='Terminada').length} tareas abiertas</p><p>${x.commitments.filter(c=>!c.done).length} compromisos pendientes</p><p>${x.imports.length} versiones FOTSC-03 importadas</p>${button('Ir a mi día','page:Mi día','soft')}</div></div></div>`}
function editEntity(id){const x=data.entities.find(x=>x.id===id)||{name:'',info:{}},v=x.info;let form=`<h2>${id?'Editar entidad':'Nueva entidad'}</h2><p class="muted">Puedes guardar con información pendiente y completarla después en Ficha de entidad → Editar información. No se sincroniza con Notion.</p><label for="ename">Nombre de la entidad *</label><input id="ename" value="${esc(x.name)}"><div class="grid" style="grid-template-columns:repeat(2,1fr)">`;for(const [k,label] of entityFields){let control;if(k==='core')control=`<select id="ei_${k}">${selectItems(cores,v[k])}</select>`;else if(k==='implementer')control=`<select id="ei_${k}">${selectItems(implementers,v[k])}</select>`;else if(['signature','preapproved','electronicPayroll'].includes(k))control=`<select id="ei_${k}">${selectItems(['Si','No'],v[k])}</select>`;else if(k==='team')control=`<select id="ei_${k}">${selectItems(['Infycredit','Visionamos'],v[k])}</select>`;else control=`<input id="ei_${k}" type="${k==='members'?'number':(k.includes('Date')||k==='signatureStart')?'date':['url','projectUrl'].includes(k)?'url':'text'}" ${k==='members'?'min="0" step="1"':''} value="${esc(v[k])}" placeholder="${k==='bag'?'Ej. 500, 1000 o Servicio':k==='nit'?'Conserva dígito de verificación si aplica':''}">`;form+=`<div><label for="ei_${k}">${label}</label>${control}</div>`}form+=`</div><label for="ei_production">Estado de producción</label><select id="ei_production">${selectItems(productionStates,v.production||'Sin empezar')}</select>`;for(const [k,label] of [['insurance','Seguro'],['guarantee','Afianzamiento']])form+=`<label for="ei_${k}">¿Tiene ${label.toLowerCase()}?</label><select id="ei_${k}">${selectItems(['Si','No'],v[k])}</select><div id="wrap_${k}" ${v[k]==='Si'?'':'hidden'}><label for="ei_${k}Provider">¿Cuál ${label.toLowerCase()} / proveedor?</label><input id="ei_${k}Provider" value="${esc(v[k+'Provider'])}"></div>`;form+='<p id="entityError" role="alert"></p><div class="actions"><button id="saveEntity"><span aria-hidden="true">💾</span> Guardar entidad</button><button id="cancelEntity" class="soft"><span aria-hidden="true">↩️</span> Cancelar</button></div>';$('#editor').innerHTML=form;$('#editor').showModal();for(const k of ['insurance','guarantee'])$('#ei_'+k).onchange=()=>{$('#wrap_'+k).hidden=$('#ei_'+k).value!=='Si'};$('#cancelEntity').onclick=()=>$('#editor').close();$('#saveEntity').onclick=()=>{const next={};for(const [k] of entityFields)next[k]=$('#ei_'+k).value.trim();next.production=$('#ei_production').value;for(const k of ['insurance','guarantee']){next[k]=$('#ei_'+k).value;next[k+'Provider']=next[k]==='Si'?$('#ei_'+k+'Provider').value.trim():''}let error='';if(!$('#ename').value.trim())error='Ingresa el nombre de la entidad.';else if(next.members!==''&&(!Number.isInteger(Number(next.members))||Number(next.members)<0))error='Asociados debe ser un número entero igual o mayor a cero.';else if(next.startDate&&next.targetDate&&next.targetDate<next.startDate)error='La fecha límite debe ser posterior al inicio.';else if([next.url,next.projectUrl].some(u=>u&&!/^https?:\/\//i.test(u)))error='La URL debe comenzar con https:// o http://.';else if(next.nit&&data.entities.some(a=>a.id!==id&&norm(a.info.nit)===norm(next.nit)))error='Ya existe una entidad con ese NIT.';if(error){$('#entityError').textContent=error;return}if(id){x.name=$('#ename').value.trim();x.info=next}else{const newEntity={id:crypto.randomUUID(),name:$('#ename').value.trim(),info:next,tasks:[],notes:[],commitments:[],checks:{},checkDetails:{},imports:[]};data.entities.push(newEntity);entity=newEntity.id}save();$('#editor').close();page='Ficha de entidad';render();toast('Ficha de entidad guardada')};}


function productionColor(s){return {'Devuelto':'background:#ffe4e8;color:#b22c49','En curso':'background:#e2efff;color:#2263a4','Marcha Blanca':'background:#fff1bd;color:#86610b','Producción':'background:#def3e8;color:#287c50'}[s]||''}
function projectEnd(){return e().tasks.map(t=>t.end).filter(Boolean).sort().at(-1)||''}
function addDays(date,n){return new Date(Date.parse(date+'T00:00:00Z')+n*86400000).toISOString().slice(0,10)}
function moveTask(i,field,value,cascade){const t=e().tasks[i],oldStart=t.start,oldEnd=t.end;if(field==='start'){t.start=value;t.end=value?addDays(value,t.plannedDuration-1):''}else if(field==='plannedDuration'){if(!Number.isInteger(+value)||+value<1)throw Error('Duración mínima: un día entero');t.plannedDuration=+value;t.end=t.start?addDays(t.start,t.plannedDuration-1):''}else if(field==='end'){if(value&&t.start&&value<t.start)throw Error('El fin no puede ser anterior al inicio');t.end=value;if(t.start&&value)t.plannedDuration=Math.round((Date.parse(value)-Date.parse(t.start))/86400000)+1}else if(field==='progress'){if(!Number.isFinite(+value)||+value<0||+value>100)throw Error('Avance entre 0 y 100');t.progress=+value;if(+value===100)t.status='Terminada';else if(t.status==='Terminada')t.status='En curso'}else if(field==='status'){t.status=value;if(value==='Terminada')t.progress=100;else if(t.progress===100)t.progress=0}else t[field]=value;if(['start','end','plannedDuration'].includes(field)){t.history=t.history||[];t.history.push({at:new Date().toISOString(),start:oldStart,end:oldEnd,reason:'Edición directa del cronograma'});t.historical=false;const shift=oldEnd&&t.end?Math.round((Date.parse(t.end)-Date.parse(oldEnd))/86400000):0;if(cascade&&shift)e().tasks.slice(i+1).forEach(next=>{if(next.status==='Terminada')return;next.history=next.history||[];next.history.push({at:new Date().toISOString(),start:next.start,end:next.end,reason:'Desplazamiento de '+shift+' días por '+t.name});if(next.start)next.start=addDays(next.start,shift);if(next.end)next.end=addDays(next.end,shift);next.historical=false})}}
function scheduleView(){const tasks=e().tasks,dates=tasks.flatMap(t=>[t.start,t.end]).filter(Boolean),min=dates.length?dates.sort()[0]:today,max=dates.length?dates.sort().at(-1):today,days=Math.max(1,Math.round((Date.parse(max)-Date.parse(min))/86400000)+1),scale=days>180?8:18,width=Math.max(500,days*scale);let axis='';for(let d=0;d<days;d+=7)axis+=`<span style="position:absolute;left:${d*scale}px;font-size:10px;white-space:nowrap">${formatDate(addDays(min,d))}</span>`;return `<div class="grid"><div class="card"><small>Inicio del proyecto</small><h2>${formatDate(min)}</h2></div><div class="card"><small>Entrega prevista acordada</small><input type="date" id="delivery" value="${esc(e().info.targetDate)}"></div><div class="card"><small>Fecha final calculada</small><h2>${formatDate(projectEnd())}</h2><small>${tasks.length?Math.round(tasks.reduce((n,t)=>n+Number(t.progress||0),0)/tasks.length):0}% de avance medio</small></div></div><div class="actions">${button('+ Nueva actividad','new')}${button('Usar plantilla de actividades','scheduleTemplate','soft')}${button('Descargar cronograma CSV','scheduleExport','soft')}</div>${scheduleGraphic(tasks,min,days)}<div class="card"><label style="margin:0"><input style="width:18px" type="checkbox" id="cascade" ${e().cascade?'checked':''}> Al ajustar una fecha, desplazar también las tareas posteriores no terminadas</label><p class="muted">Edita directamente inicio, duración, fin, estado y avance. Inicio + duración recalcula el fin; la gráfica y la fecha final se actualizan al guardar cada campo. Duración en días calendario, contando inicio y fin. El desplazamiento conserva la separación entre tareas; no aplica festivos ni dependencias automáticas.</p><div class="table" style="max-height:700px"><table class="gantt"><thead><tr><th>Actividad</th><th>Inicio</th><th>Días</th><th>Fin</th><th>Cumplida / estado</th><th>Avance %</th><th>Responsable</th><th style="min-width:${width}px"><div style="position:relative;width:${width}px;height:24px">${axis}</div></th></tr></thead><tbody>${tasks.map((t,i)=>`<tr><td><textarea aria-label="Actividad ${i+1}" data-schedule="${i}.name">${esc(t.name)}</textarea><small>${t.historical?'Fechas históricas del archivo':'Plan actual'}</small><details><summary>Observaciones</summary><textarea data-schedule="${i}.comment">${esc(t.comment)}</textarea></details></td><td><input aria-label="Inicio ${i+1}" type="date" data-schedule="${i}.start" value="${t.start}"></td><td style="min-width:80px"><input aria-label="Duración ${i+1}" style="width:75px" type="number" min="1" step="1" data-schedule="${i}.plannedDuration" value="${t.plannedDuration}"></td><td><input aria-label="Fin ${i+1}" type="date" data-schedule="${i}.end" value="${t.end}"></td><td><select data-schedule="${i}.status">${status.map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select><small>${t.status==='Terminada'?'Sí, cumplida':'No, pendiente de completar'}</small></td><td style="min-width:95px"><input style="width:80px" type="number" min="0" max="100" data-schedule="${i}.progress" value="${t.progress}"></td><td><input data-schedule="${i}.owner" value="${esc(t.owner)}"></td><td><div style="position:relative;width:${width}px;height:48px;background:repeating-linear-gradient(90deg,#f6f3fa 0,#f6f3fa ${scale*7-1}px,#dfd5ec ${scale*7-1}px,#dfd5ec ${scale*7}px);border-radius:8px">${t.start&&t.end?`<div title="${formatDate(t.start)} — ${formatDate(t.end)}" style="position:absolute;top:10px;left:${Math.round((Date.parse(t.start)-Date.parse(min))/86400000)*scale}px;width:${Math.max(scale,(Math.round((Date.parse(t.end)-Date.parse(t.start))/86400000)+1)*scale)}px;height:28px;background:${t.status==='Terminada'?'#3eaa78':t.status==='Bloqueada'?'#d95b71':t.status==='En curso'?'#408bd5':'#9862d1'};border-radius:6px;overflow:hidden"><div style="height:100%;width:${t.progress}%;background:#ffffff35"></div></div>`:''}</div></td></tr>`).join('')||'<tr><td colspan="8">Agrega una actividad para iniciar el cronograma.</td></tr>'}</tbody></table></div></div>`}

function scheduleGraphic(tasks,min,days){const span=Math.max(1,days),ticks=[];for(let n=0;n<span;n+=Math.max(1,Math.ceil(span/6)))ticks.push(`<span style="position:absolute;left:${n/span*100}%;font-size:10px">${formatDate(addDays(min,n))}</span>`);return `<div class="card"><h2>Línea de tiempo del proyecto</h2><p class="muted">La barra muestra el período de cada actividad. Se actualiza al editar las fechas o la duración en la tabla de abajo.</p><div class="graphic"><div class="graphic-row"><div></div><div style="height:30px;position:relative;margin-right:45px">${ticks.join('')}</div></div>${tasks.map((t,i)=>{const left=t.start?Math.round((Date.parse(t.start)-Date.parse(min))/86400000)/span*100:0,w=t.start&&t.end?(Math.round((Date.parse(t.end)-Date.parse(t.start))/86400000)+1)/span*100:0;return `<div class="graphic-row"><div class="graphic-label"><b>${i+1}. ${esc(t.name)}</b><small>${formatDate(t.start)} → ${formatDate(t.end)} · ${t.plannedDuration} días</small></div><div class="graphic-track">${t.start&&t.end?`<div class="graphic-bar" style="left:${left}%;width:${Math.max(.8,w)}%;background:${t.status==='Terminada'?'#3eaa78':t.status==='Bloqueada'?'#d95b71':t.status==='En curso'?'#408bd5':'#9862d1'}" title="${esc(t.name)}: ${formatDate(t.start)} a ${formatDate(t.end)}"><div style="height:100%;width:${t.progress}%;background:#ffffff40"></div></div>`:'<small>Sin fechas: completa el inicio en la tabla.</small>'}</div></div>`}).join('')||'<div class="empty">Agrega una actividad para visualizar la gráfica.</div>'}</div><div class="actions"><span class="chip">Pendiente</span><span class="chip" style="background:#e2efff;color:#2263a4">En curso</span><span class="chip late">Bloqueada</span><span class="chip" style="background:#def3e8;color:#287c50">Terminada</span></div></div>`}

function wireSchedule(){if($('#delivery'))$('#delivery').onchange=()=>{e().info.targetDate=$('#delivery').value;save();toast('Entrega prevista guardada')};if($('#cascade'))$('#cascade').onchange=()=>{e().cascade=$('#cascade').checked;save()};document.querySelectorAll('[data-schedule]').forEach(x=>x.onchange=()=>{const [i,field]=x.dataset.schedule.split('.');try{moveTask(+i,field,x.value,e().cascade);save();render();toast('Cronograma y gráfica actualizados')}catch(err){toast(err.message);render()}})}
function checklistEffectiveness(){const completed=CHECK_ITEMS.filter(x=>['Si','No aplica'].includes(e().checkDetails[x.id]?.result)).length;return {completed,total:CHECK_ITEMS.length,percent:Math.round(completed/CHECK_ITEMS.length*100)}}function checkView(){const score=checklistEffectiveness();const sections=[...new Set(CHECK_ITEMS.map(x=>x.section))];return `<div class="card checklist-score"><div class="row"><div><small>EFECTIVIDAD DEL CHECKLIST</small><div class="stat">${score.percent}%</div><small>${score.completed} de ${score.total} actividades · todas tienen el mismo peso</small></div><div><progress max="${score.total}" value="${score.completed}"></progress><p class="muted">Sí y No aplica suman. No y las actividades sin respuesta no suman.</p></div></div></div><div class="card"><h2>Checklist de preparación de marcha blanca</h2><p class="muted">Estructura del checklist compartido. Fecha actividad = realización de la actividad. Datos de entidad de referencia no trasladados a este expediente.</p></div>`+sections.map(s=>{const list=CHECK_ITEMS.filter(x=>x.section===s);return `<details class="card checklist-section" open><summary><b>${esc(s)}</b> · ${list.filter(x=>['Si','No aplica'].includes(e().checkDetails[x.id]?.result)).length}/${list.length} verificados</summary><div class="table"><table><thead><tr><th>Actividad</th><th>Fecha actividad</th><th>Responsable</th><th>Verificó / consultor</th><th>Resultado</th></tr></thead><tbody>${list.map(item=>{const v=e().checkDetails[item.id]||{};return `<tr><td>${esc(item.name)}</td>${['activityDate','owner','verifier','result'].map(k=>`<td>${k==='result'?`<select data-checkdetail="${item.id}.${k}">${selectItems(['Si','No','No aplica'],v[k])}</select>`:k==='notes'?`<textarea data-checkdetail="${item.id}.${k}">${esc(v[k])}</textarea>`:`<input type="${k.endsWith('Date')?'date':'text'}" data-checkdetail="${item.id}.${k}" value="${esc(v[k])}">`}</td>`).join('')}</tr>`}).join('')}</tbody></table></div></details>`}).join('')+`<details class="card"><summary>Lista documental inicial del cronograma (registros anteriores)</summary>${S.checks.map((s,i)=>`<label><input style="width:18px" type="checkbox" data-check="${i}" ${e().checks[i]?'checked':''}>${esc(s)}</label>`).join('')}</details>`}

async function downloadOriginal(i){const im=e().imports[i],db=await originalsDB(),r=db.transaction('files').objectStore('files').get(entity+'/'+im.sourceId);r.onsuccess=()=>{if(!r.result)return toast('Original no disponible en este navegador');const u=URL.createObjectURL(r.result),a=document.createElement('a');a.href=u;a.download=im.file;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}
function showOriginal(i){const im=e().imports[i];if(!im.sourceSheets)return toast('Esta versión anterior no conservó el original. Vuelve a cargar el archivo para visualizarlo.');$('#editor').innerHTML='<h2>Formato cargado · lectura de hojas</h2><p class="muted">Contenido del original. La vista conserva datos y celdas, no reproduce los estilos de Excel.</p><select id="originalSheet">'+im.sourceSheets.map((s,j)=>`<option value="${j}">${esc(s.name)}</option>`).join('')+'</select><div id="originalGrid"></div><button id="closePreview"><span aria-hidden="true">✖️</span> Cerrar</button>';function draw(){const sheet=im.sourceSheets[+$('#originalSheet').value],rows={};Object.entries(sheet.grid).forEach(([cell,value])=>{if(!value)return;const row=cell.match(/\d+$/)[0];rows[row]=rows[row]||[];rows[row].push([cell,value])});$('#originalGrid').innerHTML='<div class="table"><table>'+Object.entries(rows).map(([row,cells])=>'<tr><td>'+row+'</td>'+cells.map(([cell,value])=>'<td><small>'+esc(cell)+'</small><br>'+esc(value)+'</td>').join('')+'</tr>').join('')+'</table></div>'}$('#originalSheet').onchange=draw;draw();$('#closePreview').onclick=()=>$('#editor').close();$('#editor').showModal()}

function editTask(id){const t=e().tasks.find(t=>t.id===id)||{name:'',start:'',end:'',owner:'Infycredit',status:'Pendiente',priority:'Normal',progress:0,comment:'',historical:false};$('#editor').innerHTML=`<h2>${id?'Editar actividad':'Nueva actividad'}</h2><label>Actividad</label><textarea id="tname">${esc(t.name)}</textarea><div class="row"><div><label>Inicio</label><input id="tstart" type="date" value="${t.start}"></div><div><label>Fin</label><input id="tend" type="date" value="${t.end}"></div></div><label>Responsable</label><input id="towner" value="${esc(t.owner)}"><div class="row"><div><label>Estado</label><select id="tstatus">${status.map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Prioridad</label><select id="tpriority">${['Normal','Alta','Urgente'].map(s=>`<option ${s===t.priority?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Avance (%)</label><input type="number" id="tprogress" min="0" max="100" value="${t.progress}"></div></div><label>Comentario / motivo del ajuste</label><textarea id="tcomment">${esc(t.comment)}</textarea><label><input style="width:18px" type="checkbox" id="thistorical" ${t.historical?'checked':''}> Plantilla histórica (no genera alertas)</label><p id="taskError" role="alert"></p><div class="actions"><button id="saveTask"><span aria-hidden="true">💾</span> Guardar actividad</button><button id="cancelTask" class="soft"><span aria-hidden="true">↩️</span> Cancelar</button></div>`;$('#editor').showModal();$('#cancelTask').onclick=()=>$('#editor').close();$('#saveTask').onclick=()=>{const start=$('#tstart').value,end=$('#tend').value,progress=Number($('#tprogress').value);if(!$('#tname').value.trim()||(start&&end&&end<start)||!Number.isFinite(progress)||progress<0||progress>100){$('#taskError').textContent='Completa la actividad, revisa las fechas y usa un avance entre 0 y 100.';return}if(id&&(t.start!==start||t.end!==end)&&!$('#tcomment').value.trim()){$('#taskError').textContent='Registra el motivo del cambio de fechas.';return}const change={plannedDuration:start&&end?Math.round((Date.parse(end)-Date.parse(start))/86400000)+1:1,id:id||crypto.randomUUID(),name:$('#tname').value,start,end,owner:$('#towner').value,status:$('#tstatus').value,priority:$('#tpriority').value,progress:$('#tstatus').value==='Terminada'?100:progress,comment:$('#tcomment').value,historical:$('#thistorical').checked};if(id){t.history=t.history||[];t.history.push({at:new Date().toISOString(),start:t.start,end:t.end,status:t.status});Object.assign(t,change)}else e().tasks.push(change);save();$('#editor').close();render();toast('Actividad guardada')}}

function csv(im,name='FOTSC-03-horizontal.csv'){const q=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const s='\uFEFF'+[im.headers,...im.rows].map(r=>r.map(q).join(';')).join('\r\n');const u=URL.createObjectURL(new Blob([s],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
// XLSX local: ZIP central directory + XML. No network libraries.
async function unzip(buffer){if(buffer.byteLength<22)throw Error('Archivo incompleto');const b=new Uint8Array(buffer),v=new DataView(buffer),dec=new TextDecoder();let end=b.length-22;while(end>=Math.max(0,b.length-65557)&&v.getUint32(end,true)!==0x06054b50)end--;if(end<0)throw Error('No es un archivo XLSX válido');const count=v.getUint16(end+10,true);let pos=v.getUint32(end+16,true),out={},total=0;if(count>3000)throw Error('Archivo demasiado complejo');for(let i=0;i<count;i++){if(v.getUint32(pos,true)!==0x02014b50)throw Error('ZIP inválido');const method=v.getUint16(pos+10,true),compressed=v.getUint32(pos+20,true),size=v.getUint32(pos+24,true),nl=v.getUint16(pos+28,true),xl=v.getUint16(pos+30,true),cl=v.getUint16(pos+32,true),offset=v.getUint32(pos+42,true),name=dec.decode(b.slice(pos+46,pos+46+nl));pos+=46+nl+xl+cl;if(!name.endsWith('.xml')&&!name.endsWith('.rels'))continue;total+=size;if(size>12e6||total>35e6)throw Error('El contenido XML excede el límite');const start=offset+30+v.getUint16(offset+26,true)+v.getUint16(offset+28,true),raw=b.slice(start,start+compressed);let bytes;if(method===0)bytes=raw;else if(method===8){const stream=new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));bytes=new Uint8Array(await new Response(stream).arrayBuffer())}else throw Error('Compresión no compatible');if(bytes.length!==size)throw Error('Tamaño del contenido inconsistente');out[name]=dec.decode(bytes)}return out}
function xml(s){const d=new DOMParser().parseFromString(s,'application/xml');if(d.querySelector('parsererror'))throw Error('XML inválido');return d}const tags=(d,n)=>Array.from(d.getElementsByTagNameNS('*',n));const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function readWorkbook(files){const shared=files['xl/sharedStrings.xml']?tags(xml(files['xl/sharedStrings.xml']),'si').map(si=>tags(si,'t').map(t=>t.textContent).join('')):[];const rels=Object.fromEntries(tags(xml(files['xl/_rels/workbook.xml.rels']),'Relationship').map(r=>[r.getAttribute('Id'),r.getAttribute('Target')]));return tags(xml(files['xl/workbook.xml']),'sheet').map(s=>{const rid=s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'),target=rels[rid];const path=target.startsWith('/')?target.slice(1):'xl/'+target.replace(/^\.\//,'');const grid={};tags(xml(files[path]),'c').forEach(c=>{const type=c.getAttribute('t'),raw=tags(c,'v')[0]?.textContent||'',value=type==='s'?shared[+raw]:type==='inlineStr'?tags(c,'t').map(t=>t.textContent).join(''):raw;grid[c.getAttribute('r')]=value||''});return {name:s.getAttribute('name'),grid}})}
function transpose(sheet){const labels=Object.entries(sheet.grid).filter(([k])=>/^A\d+$/.test(k));const fields=S.lines;const mapped=fields.map(f=>({field:f,row:labels.find(([k,v])=>norm(v)===norm(f.label))?.[0].slice(1)}));const name=mapped.find(m=>m.field.id==='r25');if(!name?.row)throw Error('La hoja no tiene los campos verticales de líneas del FOTSC-03');const cols=Object.keys(sheet.grid).filter(k=>k.match(/\d+$/)?.[0]===name.row&&/^[A-Z]+\d+$/.test(k)&&!/^([AB])\d+$/.test(k)).map(k=>k.replace(/\d+$/,''));const idx=c=>c.split('').reduce((n,x)=>n*26+x.charCodeAt(0)-64,0);cols.sort((a,b)=>idx(a)-idx(b));const rows=cols.filter(c=>String(sheet.grid[c+name.row]||'').trim()&&!/^LINEA \d+$/i.test(sheet.grid[c+name.row])).map(c=>mapped.map(m=>m.row?sheet.grid[c+m.row]||'':''));if(!rows.length)throw Error('No se encontraron nombres de líneas diligenciados');return {headers:fields.map(f=>f.label),rows,missing:mapped.filter(m=>!m.row).map(m=>m.field.label),errors:rows.flat().filter(v=>/^#(REF!|VALUE!|DIV\/0!|N\/A)/.test(v)).length}}
async function importFile(){const f=$('#import').files[0];if(!f)return;if(f.size>15e6)return toast('El archivo supera 15 MB');$('#importStatus').textContent='Leyendo archivo…';try{const sheets=readWorkbook(await unzip(await f.arrayBuffer()));draft={file:f.name,sheets,entity,blob:f};$('#importStatus').textContent='Elige la hoja principal (no la vista horizontal antigua).';$('#preview').innerHTML='<label>Hoja a convertir</label><select id="sheet">'+sheets.map((s,i)=>`<option value="${i}" ${s.name==='FOTSC-03 '?'selected':''}>${esc(s.name)}</option>`).join('')+'</select><div class="actions"><button id="convert"><span aria-hidden="true">👀</span> Previsualizar líneas</button></div><div id="converted"></div>';$('#convert').onclick=()=>{try{const sheet=sheets[+$('#sheet').value],im={...transpose(sheet),file:f.name,sheet:sheet.name,at:new Date().toISOString()};draft.result=im;$('#converted').innerHTML=`<p><span class="chip">${im.rows.length} líneas encontradas</span></p><p class="muted">${im.missing.length?'Campos no encontrados: '+esc(im.missing.join(', '))+'. Se conservan vacíos.':'Campos reconocidos por su nombre, sin depender de la fila.'} ${im.errors?'Hay '+im.errors+' errores de Excel; revísalos antes de usar los datos.':''}</p>${table(im)}<div class="actions"><button id="acceptImport"><span aria-hidden="true">💾</span> Guardar esta versión</button><button id="downloadDraft" class="soft"><span aria-hidden="true">📥</span> Descargar CSV</button></div>`;$('#downloadDraft').onclick=()=>csv(im);$('#acceptImport').onclick=async()=>{if(draft.entity!==entity)return toast('La entidad cambió. Vuelve a importar.');try{im.sourceSheets=draft.sheets;im.sourceId=crypto.randomUUID();await putOriginal(im.sourceId,draft.blob);e().imports.push(im);save();draft=null;render();toast('Original y versión horizontal guardados')}catch(err){toast('No se pudo guardar: '+err.message)}};}catch(err){$('#converted').textContent=err.message}};}catch(err){$('#importStatus').textContent='No se pudo importar: '+err.message+'. Usa un .xlsx sin contraseña en un navegador actualizado.'}}
render();
</script></html>
